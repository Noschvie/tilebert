<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TbViewer</title>
<style>
@font-face{font-family:Sora;src:url(Sora.woff2) format("woff2");font-weight:100 800}
@font-face{font-family:Manrope;src:url(Manrope.woff2) format("woff2");font-weight:200 800}
:root{
  --card:#161a2e; --card2:#121527; --line:#262a45; --ink:#ecebff; --ink2:#9ea5c4;
  --y:#ffc145;      /* Marken-Gelb, Primaerknopf; absichtlich nicht heller (Nachtbetrieb dimmt das Fenster) */
  --b:#7db7ff;      /* Marken-Blau, Icon-Kaestchen Sekundaerknopf */
  --g:#5cd6a4;      /* ok: Status "ja" / erreichbar */
  --crit:#e2695f;   /* Fehler: Status "nein" / nicht erreichbar (immer mit Wort + Symbol) */
  --btn-line:#5f6688; /* Knopf-Kontur, >= 3:1 gegen Karte/rechtes Feld */
  --ink-on-y:#1f2440; /* Text auf Gelb */
  --r-card:36px; --r-btn:22px; --r-ic:14px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:transparent;font-family:Manrope,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent}
.dim{position:fixed;inset:0;background:rgba(6,7,14,.8);display:flex;align-items:center;justify-content:center}
.card{position:relative;width:760px;max-width:calc(100vw - 24px);max-height:calc(100vh - 24px);display:grid;grid-template-columns:1.15fr 1fr;background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.55)}
.l{min-width:0;padding:30px 32px;display:flex;flex-direction:column;gap:24px;background:radial-gradient(120% 90% at 0% 0%,#20264a 0%,var(--card) 60%)}
.brand{display:flex;align-items:center;gap:16px;min-width:0}
.brand svg{width:64px;height:64px;flex:none}
.brand div{min-width:0}
.wm{font-family:Sora;font-weight:600;font-size:40px;letter-spacing:-.03em;line-height:1}
.sub{font-size:14px;color:var(--ink2);margin-top:6px;overflow-wrap:anywhere}
.rows{margin-top:auto;display:grid;gap:10px}
.row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:10px;min-width:0}
.k{font-size:15px;color:var(--ink2);letter-spacing:.05em;text-transform:uppercase;font-weight:600;min-width:0;overflow-wrap:anywhere;hyphens:auto}
.v{font-family:Sora;font-weight:600;font-size:26px;line-height:1.15;font-variant-numeric:tabular-nums;min-width:0;text-align:right;white-space:nowrap}
.v small{font-family:Manrope;font-weight:500;font-size:14px;color:var(--ink2);margin-left:8px}
.v.srv{font-size:18px;overflow:hidden;text-overflow:ellipsis;flex:1 1 0}
.st{display:inline-flex;align-items:center;gap:8px;font-size:18px;white-space:nowrap}
.st i{width:20px;height:20px;border-radius:32%;display:inline-grid;place-items:center;font:700 13px/1 Manrope,sans-serif;font-style:normal;color:#10131f;background:var(--g)}
.ok{color:var(--g)} .bad{color:var(--crit)} .bad i{background:var(--crit)}
.r{min-width:0;padding:72px 28px 30px;display:flex;flex-direction:column;gap:12px;justify-content:center;background:var(--card2)}
button{font:600 17px Manrope,sans-serif;min-height:60px;border-radius:var(--r-btn);border:2px solid transparent;display:flex;align-items:center;gap:14px;padding:0 18px;text-align:left;cursor:pointer;min-width:0;overflow-wrap:anywhere;line-height:1.2}
button .ic{width:30px;height:30px;flex:none;border-radius:var(--r-ic);display:grid;place-items:center;font-size:17px;background:var(--b);color:var(--ink-on-y)}
.p{background:var(--y);color:var(--ink-on-y)} .p .ic{background:rgba(31,36,64,.14)}
.s{background:transparent;color:var(--ink);border-color:var(--btn-line)}
button:active{filter:brightness(1.15)}
button[hidden]{display:none}
button:focus-visible,.x:focus-visible{outline:3px solid var(--b);outline-offset:2px}
.x{position:absolute;top:6px;right:6px;width:60px;min-height:60px;height:60px;padding:0;justify-content:center;background:transparent;color:var(--ink2);font-size:30px;border-radius:var(--r-btn)}
@media (max-width:600px){
  .card{grid-template-columns:1fr;width:auto;overflow:auto}
  .l{padding:16px 16px 4px;gap:14px;background:var(--card)}
  .brand{padding-right:52px;gap:12px} .brand svg{width:48px;height:48px}
  .wm{font-size:32px} .rows{gap:8px}
  .r{padding:12px 16px 16px;gap:10px;background:var(--card);display:grid;grid-template-columns:1fr 1fr}
  button{min-height:56px}
}
</style></head><body>
<div class="dim" id="dim"><div class="card" role="dialog" aria-labelledby="wm">
<button class="x" id="x" aria-label="Close">&times;</button>
<div class="l"><div class="brand"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" ><rect x="4.000" y="4.000" width="19.137" height="19.137" rx="7.310" fill="#ffc145"/><rect x="24.863" y="4.000" width="19.137" height="19.137" rx="7.310" fill="#7db7ff"/><rect x="4.000" y="24.863" width="19.137" height="19.137" rx="7.310" fill="#ff9e7a"/><rect x="24.863" y="24.863" width="19.137" height="19.137" rx="7.310" fill="#5cd6a4"/><circle cx="13.569" cy="13.569" r="2.259" fill="#1f2440"/><rect x="28.518" y="10.612" width="11.827" height="5.914" rx="2.957" fill="#1f2440"/><circle cx="37.388" cy="13.569" r="1.921" fill="#7db7ff"/><path d="M19.276 31.475H28.724A1.070 1.070 0 0 1 29.768 32.781A5.914 5.914 0 0 1 18.232 32.781A1.070 1.070 0 0 1 19.276 31.475Z" fill="#1f2440"/></svg><div><div class="wm" id="wm">TbViewer</div><div class="sub" id="sub"></div></div></div>
<div class="rows">
<div class="row"><span class="k">TbViewer</span><span class="v"><span id="vn"></span><small id="vc"></small></span></div>
<div class="row"><span class="k">tilebert</span><span class="v" id="tb"><span id="tbv">…</span><small id="tbc"></small></span></div>
<div class="row"><span class="k">Server</span><span class="v srv" id="srv"></span></div>
<div class="row"><span class="k" id="klh"></span><span class="v st" id="home"></span></div>
</div></div>
<div class="r">
<button class="s" id="st"><span class="ic">&#9881;</span><span id="stt"></span></button>
<button class="s" id="ad" hidden><span class="ic">&#9998;</span><span id="adt"></span></button>
<button class="s" id="rs"><span class="ic">&#8635;</span><span id="rst"></span></button>
<button class="s" id="hm"><span class="ic">&#8962;</span><span id="hmt"></span></button>
</div></div></div>
<script>
(function(){
var T={
 de:{sub:"Viewer für tilebert",rs:"TbViewer neu starten",rs2:"Nochmal tippen zum Neustart",hm:"Launcher wählen",lh:"Standard-Launcher",yes:"ja",no:"nein",build:"Build ",bad:"nicht erreichbar",close:"Schließen",st:"Einstellungen",ad:"Adresse ändern"},
 en:{sub:"Viewer for tilebert",rs:"Restart TbViewer",rs2:"Tap again to restart",hm:"Choose launcher",lh:"Default launcher",yes:"yes",no:"no",build:"Build ",bad:"unreachable",close:"Close",st:"Settings",ad:"Change address"}};
var d={},t=T.de,A=window.TbInfo||{};
try{d=JSON.parse(A.data())}catch(e){}
t=T[d.lang==="en"?"en":(d.lang==="de"?"de":(/^de/.test(navigator.language)?"de":"en"))];
function $(i){return document.getElementById(i)}
$("sub").textContent=[d.model,d.android?"Android "+d.android:""].filter(Boolean).join(" · ");
$("vn").textContent=d.vn||"?"; $("vc").textContent=t.build+(d.vc||"?");
$("srv").textContent=d.origin||"–"; $("srv").title=d.origin||"";
$("klh").textContent=t.lh; $("rst").textContent=t.rs; $("hmt").textContent=t.hm;
$("x").setAttribute("aria-label",t.close);
$("stt").textContent=t.st; $("adt").textContent=t.ad;
if(d.shelly===false){   // Tablet: Adresse aendern; Launcher-Zeile/-Knopf entfallen (TbViewer ist dort kein Startbildschirm)
  $("ad").hidden=false; $("hm").hidden=true; $("klh").parentNode.style.display="none";
}   // Shelly: Adresse per Config/adb
document.documentElement.lang=d.lang||"de";
var h=!!d.home, he=$("home");
he.className="v st "+(h?"ok":"bad");
he.innerHTML="<i>"+(h?"✓":"!")+"</i>"+(h?t.yes:t.no);
if(!h&&d.shelly!==false){$("hm").className="p";} else {$("hm").className="s";}
window.tbServer=function(ok,v,c){
  var tb=$("tb");
  if(ok){$("tbv").textContent=v;$("tbc").textContent=c||"";tb.className="v";}
  else{tb.className="v st bad";tb.innerHTML="<i>!</i>"+t.bad;
    $("srv").className="v srv bad";}
};
function close(){try{A.close()}catch(e){}}
$("x").onclick=close;
$("dim").onclick=function(e){if(e.target===$("dim"))close()};
var armed=0,tm=0,rs=$("rs");
rs.onclick=function(){
  if(!armed){armed=1;$("rst").textContent=t.rs2;
    tm=setTimeout(function(){armed=0;$("rst").textContent=t.rs;},3000);return;}
  clearTimeout(tm);try{A.restart()}catch(e){}
};
$("hm").onclick=function(){try{A.chooseHome()}catch(e){}};
$("st").onclick=function(){try{A.settings()}catch(e){}};
$("ad").onclick=function(){try{A.changeAddr()}catch(e){}};
try{A.ready()}catch(e){}
})();
</script></body></html>
