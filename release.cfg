[AUTOUPDATE]
# Release-Beschreibung fuer LoxBerrys Auto-Update (plugin.cfg -> RELEASECFG, stabiler Kanal).
# VERSION muss bei JEDEM Release hochgezaehlt werden (SemVer, rein numerisch:
# 0.19.40, 0.19.41 ...), sonst erkennt LoxBerry das Update nicht.
# ARCHIVEURL/INFOURL zeigen auf das GitHub-Release des Tags v<VERSION> (ZIP-Asset).
VERSION=0.20.13
ARCHIVEURL=https://github.com/actionhero-zz/tilebert/releases/download/v0.20.13/loxpanelfav-0.20.13.zip
INFOURL=https://github.com/actionhero-zz/tilebert/releases/tag/v0.20.13
